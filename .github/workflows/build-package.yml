name: Build Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(jq -r .version package.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          DEST="staging/Assets/BetaHub Bug Reporter"
          mkdir -p "$DEST"

          # Copy core directories with their metas
          for dir in Runtime Editor Plugins; do
            cp -r "$dir" "$DEST/"
            cp "$dir.meta" "$DEST/"
          done

          # Copy Samples (from Samples~ without the tilde)
          mkdir -p "$DEST/Samples"
          cp -r "Samples~/ExampleScene" "$DEST/Samples/"
          # Folder meta may not exist; Unity regenerates it on import
          cp "Samples~/ExampleScene.meta" "$DEST/Samples/" 2>/dev/null || true

          # Copy root files with their metas
          for file in package.json LICENSE.txt README.md Documentation.html CHANGELOG.md; do
            cp "$file" "$DEST/"
            cp "$file.meta" "$DEST/"
          done

          # Clean up unwanted files
          find staging -name '.DS_Store' -delete

          # Create zip
          cd staging
          zip -r "../BetaHubBugReporter-${{ steps.version.outputs.version }}.zip" .

      - name: Build unitypackage
        run: |
          PKGDIR=$(mktemp -d)
          cd staging

          find . -name '*.meta' -print0 | while IFS= read -r -d '' meta; do
            guid=$(grep '^guid:' "$meta" | awk '{print $2}' | tr -d '\r')
            if [ -z "$guid" ]; then
              echo "WARNING: No GUID in $meta, skipping"
              continue
            fi

            mkdir -p "$PKGDIR/$guid"

            # Remove leading ./
            meta_rel="${meta#./}"
            # Asset path is the meta path without .meta suffix
            asset_rel="${meta_rel%.meta}"

            printf '%s' "$asset_rel" > "$PKGDIR/$guid/pathname"
            cp "$meta" "$PKGDIR/$guid/asset.meta"

            # Only copy asset content for files, not directories
            if [ -f "$asset_rel" ]; then
              cp "$asset_rel" "$PKGDIR/$guid/asset"
            fi
          done

          cd "$PKGDIR"
          tar czf "$GITHUB_WORKSPACE/BetaHubBugReporter-${{ steps.version.outputs.version }}.unitypackage" .
          rm -rf "$PKGDIR"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetaHubBugReporter-${{ steps.version.outputs.version }}
          path: BetaHubBugReporter-${{ steps.version.outputs.version }}.zip

      - name: Upload unitypackage artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetaHubBugReporter-${{ steps.version.outputs.version }}-unitypackage
          path: BetaHubBugReporter-${{ steps.version.outputs.version }}.unitypackage

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BetaHubBugReporter-${{ steps.version.outputs.version }}.zip
            BetaHubBugReporter-${{ steps.version.outputs.version }}.unitypackage
